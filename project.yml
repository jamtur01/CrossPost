name: CrossPost
options:
  bundleIdPrefix: net.kartar
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.4.10"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: net.kartar.crosspost
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
packages:
  TootSDK:
    url: https://github.com/TootSDK/TootSDK
    exactVersion: 21.8.0
  ATProtoKit:
    url: https://github.com/MasterJ93/ATProtoKit
    exactVersion: 0.32.5
targets:
  CrossPost:
    type: application
    platform: macOS
    # Debug signing is driven by Signing.xcconfig, which optionally includes a
    # gitignored Local.xcconfig. Without it, builds fall back to Xcode's
    # automatic local signing (ad-hoc) — so teammates and CI are unaffected.
    configFiles:
      Debug: Signing.xcconfig
    sources:
      - path: Sources
        excludes:
          - "**/CLAUDE.md"   # docs, not app resources (would collide in Resources/)
    dependencies:
      - package: TootSDK
      - package: ATProtoKit
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: CrossPost.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Hardened Runtime is a distribution requirement; enforcing it on Debug
        # makes a self-signed local build's library validation reject the
        # (same-cert but Team-ID-less) debug dylib. Release keeps it for CI.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  CrossPostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - "**/CLAUDE.md"
    dependencies:
      - target: CrossPost
      - package: TootSDK
      - package: ATProtoKit
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CrossPost.app/Contents/MacOS/CrossPost"
schemes:
  CrossPost:
    build:
      targets:
        CrossPost: all
        CrossPostTests: [test]
    test:
      targets:
        - CrossPostTests
