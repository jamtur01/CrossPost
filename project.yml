name: CrossPost
options:
  bundleIdPrefix: net.kartar
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.4.21"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: net.kartar.crosspost
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
packages:
  TootSDK:
    url: https://github.com/TootSDK/TootSDK
    exactVersion: 23.0.0
  ATProtoKit:
    url: https://github.com/MasterJ93/ATProtoKit
    exactVersion: 0.32.5
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  CrossPost:
    type: application
    platform: macOS
    # Debug signing is driven by Signing.xcconfig, which optionally includes a
    # gitignored Local.xcconfig. Without it, builds fall back to Xcode's
    # automatic local signing (ad-hoc) — so teammates and CI are unaffected.
    configFiles:
      Debug: Signing.xcconfig
    sources:
      - path: Sources
        excludes:
          - "**/CLAUDE.md"   # docs, not app resources (would collide in Resources/)
    dependencies:
      - package: TootSDK
      - package: ATProtoKit
      - package: Sparkle
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: CrossPost.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Hardened Runtime is a distribution requirement; enforcing it on Debug
        # makes a self-signed local build's library validation reject the
        # (same-cert but Team-ID-less) debug dylib. Release keeps it for CI.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  CrossPostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - "**/CLAUDE.md"
    # The tests run inside the app (TEST_HOST), which already links TootSDK and
    # ATProtoKit; their modules are importable from the build products. Linking
    # the packages here as well made Xcode emit 40 dependency warnings from
    # swift-nio, swift-collections and swift-url on every clean build.
    dependencies:
      - target: CrossPost
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CrossPost.app/Contents/MacOS/CrossPost"
schemes:
  CrossPost:
    build:
      targets:
        CrossPost: all
        CrossPostTests: [test]
    test:
      targets:
        - CrossPostTests
