name: Create Release

on:
  push:
    tags:
      - "v*"

# Required repository secrets (Developer ID signing + notarization):
#   MACOS_CERTIFICATE_P12         base64 of a "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD    password for that .p12
#   MACOS_CODESIGN_IDENTITY       e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID                      Apple ID email used for notarization
#   MACOS_API_ISSUER_ID           Apple Developer Team ID (name kept for parity)
#   APPLE_APP_SPECIFIC_PASSWORD   app-specific password for that Apple ID

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: dd-test-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: dd-test-${{ runner.os }}-
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project CrossPost.xcodeproj -scheme CrossPost
      - name: Build and test
        run: |
          xcodebuild test \
            -project CrossPost.xcodeproj \
            -scheme CrossPost \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=""

  create-release:
    needs: build-and-test
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: build/DerivedData
          key: dd-release-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: dd-release-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "temporary-password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temporary-password" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temporary-password" build.keychain

      - name: Build Release app bundle
        run: |
          chmod +x ./build.sh
          ./build.sh --release

      - name: Code sign the app
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          # codesign secure-timestamps against Apple's server, which can hang
          # transiently. Run with a 120s watchdog and retry so a stuck request
          # doesn't wedge the job for hours.
          sign_with_timeout() {
            /usr/bin/codesign --force --options runtime --timestamp \
              --sign "$MACOS_CODESIGN_IDENTITY" --deep build/CrossPost.app &
            local pid=$! waited=0
            while kill -0 "$pid" 2>/dev/null; do
              if [ "$waited" -ge 120 ]; then
                echo "codesign exceeded 120s; killing and retrying"
                kill -9 "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                return 124
              fi
              sleep 5
              waited=$((waited + 5))
            done
            wait "$pid"
          }
          for attempt in 1 2 3; do
            if sign_with_timeout; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "codesign failed after 3 attempts"; exit 1; fi
            echo "retrying codesign (attempt $((attempt + 1)))..."
            sleep 10
          done
          /usr/bin/codesign --verify --strict --verbose=2 build/CrossPost.app

      - name: Notarize the app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          MACOS_API_ISSUER_ID: ${{ secrets.MACOS_API_ISSUER_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$MACOS_API_ISSUER_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

          ditto -c -k --keepParent build/CrossPost.app notarization.zip

          xcrun notarytool submit notarization.zip --keychain-profile "notarytool-profile" --wait
          xcrun stapler staple build/CrossPost.app || echo "Stapling failed, but continuing..."

      - name: Create final ZIP archive
        run: |
          ditto -c -k --keepParent build/CrossPost.app "CrossPost-${GITHUB_REF_NAME}.zip"

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: CrossPost ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            CrossPost-${{ github.ref_name }}.zip
          body: |
            # CrossPost ${{ steps.get_version.outputs.VERSION }}

            A native macOS app for reading and posting to Mastodon and Bluesky side by side.

            ## Installation

            1. Download `CrossPost-${{ github.ref_name }}.zip`
            2. Unzip it
            3. Move `CrossPost.app` to your Applications folder
            4. Open it

            This build is signed with a Developer ID and notarized by Apple.
