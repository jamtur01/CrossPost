name: Create Release

on:
  push:
    tags:
      # Plain x.y.z only: every release becomes "latest" and Sparkle offers it to
      # all users, so a pre-release tag (v1.0.0-beta.1) must not publish one.
      - "v[0-9]+.[0-9]+.[0-9]+"

# Required repository secrets (Developer ID signing + notarization):
#   MACOS_CERTIFICATE_P12         base64 of a "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD    password for that .p12
#   MACOS_CODESIGN_IDENTITY       e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID                      Apple ID email used for notarization
#   MACOS_API_ISSUER_ID           Apple Developer Team ID (name kept for parity)
#   APPLE_APP_SPECIFIC_PASSWORD   app-specific password for that Apple ID
#   SPARKLE_PRIVATE_KEY           EdDSA key for the appcast (`generate_keys -x`)

jobs:
  changelog-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require a CHANGELOG entry for this tag
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          # The section becomes both the GitHub notes and Sparkle's update notes.
          if [ -z "$(scripts/changelog-section.sh "$version" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md's '## [$version]' section is missing or empty." \
              "Fill it in before tagging v$version."
            exit 1
          fi
          echo "Found CHANGELOG entry for $version."

  build-and-test:
    uses: ./.github/workflows/test.yml

  create-release:
    needs: [changelog-check, build-and-test]
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write
    # Pinned to the Xcode the project is built with locally (27.1). The xcode-27
    # image is a GitHub preview; macos-26 tops out at Xcode 26.6.
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: build/DerivedData
          key: dd-release-${{ runner.os }}-xcode27.1-${{ hashFiles('project.yml') }}
          restore-keys: dd-release-${{ runner.os }}-xcode27.1-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          # Per-run random keychain password; nothing outside this step needs it.
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # New keychains auto-lock after 300s. The Release build runs between this
          # unlock and codesign; when it took >5min (cold caches), codesign hit a
          # locked keychain and hung forever on a headless SecurityAgent prompt.
          security set-keychain-settings -lut 21600 build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f certificate.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Build Release app bundle
        run: |
          chmod +x ./build.sh
          export CROSSPOST_MARKETING_VERSION="${GITHUB_REF#refs/tags/v}"
          ./build.sh --release

      - name: Code sign the app
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          # Sign innermost-out instead of --deep: --deep would stamp the App
          # Sandbox entitlement from CrossPost.entitlements onto every nested
          # Mach-O, and Apple has deprecated --deep for signing anyway.
          sign_app() {
            # Nested code first (-depth = deepest paths first), no entitlements.
            # Sparkle's Autoupdate is a bare executable, so match it by path.
            # Skip symlinks: Sparkle.framework/Updater.app points at Versions/B's.
            find build/CrossPost.app/Contents -depth ! -type l \
              \( -name '*.framework' -o -name '*.dylib' -o -name '*.xpc' \
                 -o -name '*.appex' -o -name '*.bundle' -o -name '*.app' \
                 -o -path '*/Versions/B/Autoupdate' \) -print0 |
              while IFS= read -r -d '' item; do
                /usr/bin/codesign --force --options runtime --timestamp \
                  --sign "$MACOS_CODESIGN_IDENTITY" "$item" || exit 1
              done || return 1 # The loop is a subshell; its exit alone doesn't stop sign_app.
            # Outer app last, with its entitlements and without --deep.
            /usr/bin/codesign --force --options runtime --timestamp \
              --entitlements CrossPost.entitlements \
              --sign "$MACOS_CODESIGN_IDENTITY" build/CrossPost.app
          }
          # Watchdog + retry so a stuck codesign (slow timestamp server, locked
          # keychain) fails the job in minutes instead of wedging it for hours.
          sign_with_timeout() {
            sign_app &
            local pid=$! waited=0
            while kill -0 "$pid" 2>/dev/null; do
              if [ "$waited" -ge 420 ]; then
                echo "codesign exceeded 420s; killing and retrying"
                kill -9 "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                return 124
              fi
              sleep 5
              waited=$((waited + 5))
            done
            wait "$pid"
          }
          for attempt in 1 2 3; do
            if sign_with_timeout; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "codesign failed after 3 attempts"; exit 1; fi
            echo "retrying codesign (attempt $((attempt + 1)))..."
            sleep 10
          done
          /usr/bin/codesign --verify --strict --verbose=2 build/CrossPost.app

      - name: Notarize the app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          MACOS_API_ISSUER_ID: ${{ secrets.MACOS_API_ISSUER_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$MACOS_API_ISSUER_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

          ditto -c -k --keepParent build/CrossPost.app notarization.zip

          xcrun notarytool submit notarization.zip --keychain-profile "notarytool-profile" --wait
          xcrun stapler staple build/CrossPost.app

      - name: Create final ZIP archive
        run: |
          ditto -c -k --keepParent build/CrossPost.app "CrossPost-${GITHUB_REF_NAME}.zip"

      - name: Build, sign, and notarize DMG
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          dmg="CrossPost-${GITHUB_REF_NAME}.dmg"
          # Stage the (stapled) app plus a drag-to-Applications shortcut.
          staging="$(mktemp -d)"
          cp -R build/CrossPost.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "CrossPost" -srcfolder "$staging" -ov -format UDZO "$dmg"
          rm -rf "$staging"
          # Sign, notarize, and staple the DMG itself so Gatekeeper trusts it directly.
          /usr/bin/codesign --force --timestamp --sign "$MACOS_CODESIGN_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --keychain-profile "notarytool-profile" --wait
          xcrun stapler staple "$dmg"

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build release notes from CHANGELOG
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          REF: ${{ github.ref_name }}
        run: scripts/extract-release-notes.sh "$VERSION" "$REF" > release-notes.md

      # The app reads the newest release's appcast.xml via
      # releases/latest/download/appcast.xml, so each appcast lists only its own
      # release. The update dialog shows this version's CHANGELOG section.
      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          download_prefix="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/"
          mkdir appcast
          cp "CrossPost-${tag}.zip" appcast/
          scripts/changelog-section.sh "${tag#v}" > "appcast/CrossPost-${tag}.md"
          echo "$SPARKLE_PRIVATE_KEY" |
            build/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - --embed-release-notes \
              --download-url-prefix "$download_prefix" \
              appcast
          cat appcast/appcast.xml

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: CrossPost ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          body_path: release-notes.md
          files: |
            CrossPost-${{ github.ref_name }}.dmg
            CrossPost-${{ github.ref_name }}.zip
            appcast/appcast.xml
