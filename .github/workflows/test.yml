name: Build and Test

# Reusable build-and-test job shared by ci.yml and release.yml so the two
# cannot drift apart.

on:
  workflow_call:

jobs:
  build-test:
    runs-on: xcode-27
    # codesign has a history of hanging on this project; match the release
    # job's ceiling instead of letting a wedged run burn the 6h default.
    timeout-minutes: 30
    # Pinned to the Xcode the project is built with locally (27.1). The xcode-27
    # image is a GitHub preview; macos-26 tops out at Xcode 26.6.
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: dd-test-${{ runner.os }}-xcode27.1-${{ hashFiles('project.yml') }}
          restore-keys: dd-test-${{ runner.os }}-xcode27.1-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project CrossPost.xcodeproj -scheme CrossPost

      - name: Build and test
        run: |
          xcodebuild test \
            -project CrossPost.xcodeproj \
            -scheme CrossPost \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=""

  lint:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      # Keep in step with the local tools; bump version and checksum together.
      SWIFTFORMAT_VERSION: "0.63.1"
      SWIFTFORMAT_SHA256: "385ef1a263ba28685157b98c5536b9c9105e124518f28b7ef8a2bee4b167eaeb"
      SWIFTLINT_VERSION: "0.65.1"
      SWIFTLINT_SHA256: "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0"
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned SwiftFormat and SwiftLint
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "$SWIFTFORMAT_VERSION" --repo nicklockwood/SwiftFormat --pattern swiftformat.zip
          echo "${SWIFTFORMAT_SHA256}  swiftformat.zip" | shasum -a 256 -c -
          gh release download "$SWIFTLINT_VERSION" --repo realm/SwiftLint --pattern portable_swiftlint.zip
          echo "${SWIFTLINT_SHA256}  portable_swiftlint.zip" | shasum -a 256 -c -
          mkdir -p bin
          unzip -q -o swiftformat.zip swiftformat -d bin
          unzip -q -o portable_swiftlint.zip swiftlint -d bin
          chmod +x bin/swiftformat bin/swiftlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: ./lint.sh
